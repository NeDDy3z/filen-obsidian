name: Release

# Cut a release by pushing a tag that matches the manifest version, e.g. `git tag 0.1.2 && git push origin 0.1.2`.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Obsidian requires the release tag and manifest.json version to be identical.
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - run: npm run build

      # Signs main.js so anyone can confirm it was built from this repo at this commit:
      #   gh attestation verify main.js -R ${{ github.repository }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          **Back up your vault before using this.** After installing, log in and press **Check connection** first, which uploads, downloads, compares and deletes a small test file.

          ## Install

          Install with [BRAT](https://github.com/TfTHacker/obsidian42-brat) using \`$REPO\`, or download \`main.js\` and \`manifest.json\` below into \`<your vault>/.obsidian/plugins/filen-sync/\` and restart Obsidian.

          ## Verifying this build

          \`main.js\` was built by GitHub Actions from this repository and signed, so you can check it yourself:

          \`\`\`
          gh attestation verify main.js -R $REPO
          \`\`\`

          ## Licensing

          The plugin source is Apache-2.0, but this build bundles \`@filen/sdk\`, which is AGPL-3.0. See the README.

          **Commits**: https://github.com/$REPO/commits/$GITHUB_REF_NAME
          EOF
          gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --notes-file notes.md
